    <!-- Apply saved theme and language before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("darkMode");
          var dark = saved !== null ? JSON.parse(saved) : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          var locale = localStorage.getItem("locale") || (navigator.language || "en").slice(0, 2);
          document.documentElement.lang = locale === "pl" ? "pl" : "en";
        } catch (e) {}
      })();
    </script>

    <link
      rel="preload"
      as="image"
      href="/images/kp-photo-800.webp"
      imagesrcset="/images/kp-photo-800.webp 800w, /images/kp-photo-1400.webp 1400w"
      imagesizes="(min-width: 1024px) 600px, 100vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
